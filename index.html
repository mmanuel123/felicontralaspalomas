<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Feli contra las Palomas — Runner Bahía Blanca</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="touch-controls">
      <button id="btn-up" class="touch-btn touch-btn-up" aria-label="Subir">▲<span>SUBIR</span></button>
      <button id="btn-down" class="touch-btn touch-btn-down" aria-label="Bajar">▼<span>BAJAR</span></button>
      <button id="btn-jump" class="touch-btn touch-btn-jump" aria-label="Saltar">⬆<span>SALTAR</span></button>
    </div>
    <div id="overlay"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/level.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
